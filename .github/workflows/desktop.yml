name: Desktop builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: desktop:dist:win
            artifact: windows
          - os: macos-latest
            script: desktop:dist:mac
            artifact: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install root (Electron)
        run: npm ci

      - name: Install backend
        run: npm ci --prefix backend

      - name: Install frontend
        run: npm ci --prefix frontend

      - name: Build desktop package
        env:
          # Unsigned builds; avoids winCodeSign symlink issues on Windows.
          # Publishing is handled by softprops/action-gh-release, not electron-builder.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Formel1Dash-${{ matrix.artifact }}
          path: |
            dist-desktop/*.*
            !dist-desktop/*.blockmap
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.AppImage
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
